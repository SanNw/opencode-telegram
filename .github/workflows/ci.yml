name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run check
      - run: npm.cmd test
      - run: npm.cmd run build
      - run: npm.cmd run test:runtime
      - run: npm.cmd audit --omit=dev --audit-level=high
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:runtime
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify browser interface and isolated HTML preview
        run: |
          browser_binary=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser_binary="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$browser_binary" ]; then
            echo "No Chromium executable found on this runner. Browser verification cannot be skipped."
            exit 1
          fi
          export CHROME_BINARY="$browser_binary"
          npm run test:browser
          npm run test:preview
      - name: Preserve isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/browser/
          if-no-files-found: warn
          retention-days: 7
      - name: Validate container configuration with placeholder credentials
        run: |
          cp .env.example .env
          OPENCODE_DIRECTORY="$GITHUB_WORKSPACE" docker compose config --quiet
      - name: Build container (does not publish or deploy)
        run: docker build --tag opencode-telegram:ci .
